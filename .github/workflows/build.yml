name: Build mod
on:
  push:
    branches-ignore: [jar-output]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.8 }
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: towa-jar, path: build/libs/*.jar }
      - name: Publish jar to branch jar-output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/out
          cp build/libs/*.jar /tmp/out/
          cd /tmp/out
          git init -q -b jar-output
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add .
          git commit -q -m 'Built jar'
          git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" jar-output
